<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT MEMES - FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding:15px;text-align:center}
h1{color:#1e90ff}
.box{background:#111;border:1px solid #1e90ff44;border-radius:15px;padding:15px;margin:15px auto;max-width:480px}
input,select{width:100%;padding:11px;margin:7px 0;background:#000;border:1px solid #333;color:#fff;border-radius:8px}
button{padding:12px 20px;background:#1e90ff;border:none;color:#fff;border-radius:20px;font-weight:bold;cursor:pointer;margin:5px}
#memeCanvas{width:100%;max-width:400px;border-radius:10px;background:#000;margin-top:10px}
label{font-size:13px;color:#1e90ff;text-align:left;display:block;margin-top:10px}
</style>
</head>
<body>
<h1>😂 IT MEMES - FIXED</h1>
<div class="box">
  <input type="file" id="imgInput" accept="image/*" onchange="loadImage(event)">
  <label>👉 CHAGUA UKUBWA WA MANENO HAPA:</label>
  <select id="fontSize" onchange="drawMeme()">
    <option value="16">MADOGO KABISA - 16</option>
    <option value="20" selected>KATI - 20</option>
    <option value="26">MAKUBWA - 26</option>
    <option value="32">MAKUBWA SANA - 32</option>
  </select>
  <input id="topText" placeholder="Maneno ya JUU" oninput="drawMeme()">
  <input id="bottomText" placeholder="Maneno ya CHINI" oninput="drawMeme()">
  <canvas id="memeCanvas" width="400" height="400"></canvas><br>
  <button onclick="downloadMeme()">⬇️ Download Meme</button>
  <button onclick="postAsStatus()" style="background:#00c853">📱 Post kama Status</button>
</div>
<script>
let img=null;
let canvas=document.getElementById('memeCanvas');
let ctx=canvas.getContext('2d');
function loadImage(e){
  let f=e.target.files[0];let r=new FileReader();
  r.onload=function(ev){img=new Image();img.onload=drawMeme;img.src=ev.target.result;}
  r.readAsDataURL(f);
}
// INAGAWA MANENO NA KUPUNGUZA FONT IKIWA MREFU
function drawMeme(){
  if(!img) return;
  ctx.clearRect(0,0,400,400);
  ctx.drawImage(img,0,0,400,400);
  let baseSize=parseInt(document.getElementById('fontSize').value);
  let top=document.getElementById('topText').value.toUpperCase();
  let bottom=document.getElementById('bottomText').value.toUpperCase();
  drawWrapped(top, true, baseSize);
  drawWrapped(bottom, false, baseSize);
}
function drawWrapped(text, isTop, baseSize){
  if(!text) return;
  let size=baseSize;
  // Kama neno ni refu, punguza font hadi iingie
  ctx.font=`bold ${size}px Arial`;
  while(ctx.measureText(text).width > 340 && size > 12){
    size -= 2;
    ctx.font=`bold ${size}px Arial`;
  }
  // Gawa kwa maneno - kila mstari max 20 herufi
  let words=text.split(' ');
  let lines=[];let cur='';
  for(let w of words){
    let test=cur?cur+' '+w:w;
    ctx.font=`bold ${size}px Arial`;
    if(ctx.measureText(test).width > 360){
      lines.push(cur);cur=w;
    }else{cur=test;}
  }
  if(cur) lines.push(cur);
  ctx.fillStyle="white";ctx.strokeStyle="black";ctx.lineWidth=3;ctx.textAlign="center";ctx.font=`bold ${size}px Arial`;
  lines.forEach((line,i)=>{
    let y;
    if(isTop){ y=35 + i*(size+8); }
    else{ y=385 - (lines.length-1-i)*(size+8); }
    ctx.strokeText(line,200,y);
    ctx.fillText(line,200,y);
  });
}
function downloadMeme(){let a=document.createElement('a');a.download='it-meme.png';a.href=canvas.toDataURL();a.click();}
function postAsStatus(){alert('Meme imeshapost kama Status!');}
</script>
</body>
</html>
